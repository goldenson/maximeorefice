<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-label="Schema du cablage Ethernet en etoile depuis le patch panel du sous-sol vers les bornes Wi-Fi et l'Apple TV, et du maillage Thread depuis le Connect ZBT-2 et l'Apple TV vers la serrure Nuki et les capteurs IKEA, montrant que le ZBT-2 seul doit traverser deux dalles en beton pour atteindre l'etage alors que l'Apple TV n'en traverse qu'une.">
  <defs>
    <marker id="arrowWired" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0E6E64" />
    </marker>
    <marker id="arrowThread" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B5651D" />
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="700" fill="#FFFFFF" />

  <!-- floor bands -->
  <text x="24" y="58" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1" fill="#62676F">ÉTAGE</text>
  <text x="24" y="262" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1" fill="#62676F">REZ</text>
  <text x="24" y="466" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1" fill="#62676F">SOUS-SOL</text>

  <!-- slab bands -->
  <rect x="24" y="222" width="872" height="22" fill="#E3E1D9" />
  <line x1="24" y1="222" x2="896" y2="222" stroke="#8A8F98" stroke-width="1.4" stroke-dasharray="2 3" />
  <line x1="24" y1="244" x2="896" y2="244" stroke="#8A8F98" stroke-width="1.4" stroke-dasharray="2 3" />
  <text x="560" y="237" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" letter-spacing="0.5" fill="#8A8F98">DALLE BÉTON ARMÉ</text>

  <rect x="24" y="426" width="872" height="22" fill="#E3E1D9" />
  <line x1="24" y1="426" x2="896" y2="426" stroke="#8A8F98" stroke-width="1.4" stroke-dasharray="2 3" />
  <line x1="24" y1="448" x2="896" y2="448" stroke="#8A8F98" stroke-width="1.4" stroke-dasharray="2 3" />
  <text x="560" y="441" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" letter-spacing="0.5" fill="#8A8F98">DALLE BÉTON ARMÉ</text>

  <!-- rack boundary -->
  <rect x="20" y="520" width="590" height="172" rx="8" fill="none" stroke="#D8D5CC" stroke-width="1.4" stroke-dasharray="4 4" />
  <text x="36" y="538" font-family="ui-monospace, Menlo, monospace" font-size="10.5" letter-spacing="0.8" fill="#62676F">ARMOIRE 12U · SOUS-SOL</text>

  <!-- ===== WIRED ETHERNET (solid, teal) ===== -->
  <g fill="none" stroke="#0E6E64" stroke-width="2">
    <line x1="130" y1="560" x2="150" y2="560" marker-end="url(#arrowWired)" />
    <line x1="290" y1="560" x2="310" y2="560" />
    <line x1="440" y1="560" x2="460" y2="560" />
    <polyline points="375,582 375,610 300,610 300,626" />
    <polyline points="375,582 375,610 460,610 460,626" />
    <line x1="530" y1="538" x2="530" y2="130" />
    <line x1="600" y1="560" x2="635" y2="560" />
    <polyline points="530,582 530,605 785,605" />
    <line x1="530" y1="310" x2="635" y2="310" />
    <line x1="530" y1="380" x2="785" y2="380" />
    <line x1="530" y1="130" x2="635" y2="130" />
  </g>
  <text x="538" y="485" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">Cat6A ×5</text>
  <text x="140" y="600" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">coax · 2.5 Gbit/s</text>

  <!-- ===== THREAD MESH (dashed, amber) ===== -->
  <g fill="none" stroke="#B5651D" stroke-width="1.6" stroke-dasharray="5 4">
    <polyline points="300,626 300,398 220,398 220,382" marker-end="url(#arrowThread)" />
    <polyline points="330,626 330,150 230,150" marker-end="url(#arrowThread)" />
    <polyline points="850,356 850,115 230,115" marker-end="url(#arrowThread)" />
  </g>
  <text x="230" y="412" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#B5651D">Thread · 1 dalle</text>
  <text x="345" y="300" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#B5651D">Thread · 2 dalles</text>
  <text x="700" y="252" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#B5651D">Thread · 1 dalle (relais)</text>

  <!-- ===== NODES ===== -->
  <!-- WAN -->
  <rect x="30" y="538" width="100" height="44" rx="6" fill="#FFFFFF" stroke="#62676F" stroke-width="1.2" />
  <text x="80" y="556" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">YALLO</text>
  <text x="80" y="570" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">box FAI</text>

  <!-- Gateway -->
  <rect x="150" y="538" width="140" height="44" rx="6" fill="#FFFFFF" stroke="#62676F" stroke-width="1.2" />
  <text x="220" y="556" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">GATEWAY ULTRA</text>
  <text x="220" y="570" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">1 Gbps IPS</text>

  <!-- Switch -->
  <rect x="310" y="538" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#62676F" stroke-width="1.2" />
  <text x="375" y="556" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">SWITCH LITE 8</text>
  <text x="375" y="570" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">4× PoE+ · 52W</text>

  <!-- Patch panel -->
  <rect x="460" y="538" width="140" height="44" rx="6" fill="#FFFFFF" stroke="#62676F" stroke-width="1.2" />
  <text x="530" y="556" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">PATCH PANEL</text>
  <text x="530" y="570" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">12 ports</text>

  <!-- HA Green -->
  <rect x="225" y="626" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#62676F" stroke-width="1.2" />
  <text x="300" y="645" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">HOME ASSISTANT</text>
  <text x="300" y="659" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">+ Connect ZBT-2</text>

  <!-- NAS -->
  <rect x="395" y="626" width="130" height="46" rx="6" fill="#FFFFFF" stroke="#62676F" stroke-width="1.2" />
  <text x="460" y="645" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">NAS DS918+</text>
  <text x="460" y="659" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">Synology</text>

  <!-- U7 Lite Sous-sol -->
  <rect x="635" y="538" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#62676F" stroke-width="1.2" />
  <text x="700" y="556" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">U7 LITE</text>
  <text x="700" y="570" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">Sous-sol</text>

  <!-- UK-Ultra -->
  <rect x="785" y="583" width="120" height="44" rx="6" fill="#FFFFFF" stroke="#62676F" stroke-width="1.2" />
  <text x="845" y="601" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">UK-ULTRA</text>
  <text x="845" y="615" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">Jardin</text>

  <!-- U7 Lite Rez -->
  <rect x="635" y="288" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#62676F" stroke-width="1.2" />
  <text x="700" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">U7 LITE</text>
  <text x="700" y="320" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">Rez</text>

  <!-- Apple TV -->
  <rect x="785" y="358" width="130" height="46" rx="6" fill="#FFFFFF" stroke="#62676F" stroke-width="1.2" />
  <text x="850" y="377" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">APPLE TV 4K</text>
  <text x="850" y="391" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">Salon</text>

  <!-- Nuki (thread-only) -->
  <rect x="150" y="358" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#B5651D" stroke-width="1.2" stroke-dasharray="3 3" />
  <text x="225" y="377" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">NUKI SMART LOCK</text>
  <text x="225" y="391" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">Porte d'entrée</text>

  <!-- U7 Lite Étage -->
  <rect x="635" y="108" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#62676F" stroke-width="1.2" />
  <text x="700" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">U7 LITE</text>
  <text x="700" y="140" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">Étage</text>

  <!-- IKEA sensors (thread-only) -->
  <rect x="70" y="106" width="160" height="48" rx="6" fill="#FFFFFF" stroke="#B5651D" stroke-width="1.2" stroke-dasharray="3 3" />
  <text x="150" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C2024">AQARA P2 ×6</text>
  <text x="150" y="140" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">fenêtres / portes</text>
</svg>
