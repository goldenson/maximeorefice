<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" aria-label="Elevation du coffret 12U montrant l'ordre de montage de haut en bas : patch panel en U1, etagere Cloud Gateway/Switch/Home Assistant Green en U2, etagere NAS et box Yallo sur 5U de U3 a U7, PDU en U8, onduleur en U9, et 3U de marge libre de U10 a U12.">
  <rect x="0" y="0" width="560" height="620" fill="#FFFFFF" />

  <text x="280" y="32" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1" fill="#62676F">COFFRET 12U · SOUS-SOL</text>

  <!-- rack outer frame -->
  <rect x="180" y="60" width="220" height="480" rx="4" fill="none" stroke="#8A8F98" stroke-width="1.6" />

  <!-- U ruler ticks + numbers -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#8A8F98">
    <text x="170" y="84" text-anchor="end">U1</text>
    <text x="170" y="124" text-anchor="end">U2</text>
    <text x="170" y="164" text-anchor="end">U3</text>
    <text x="170" y="204" text-anchor="end">U4</text>
    <text x="170" y="244" text-anchor="end">U5</text>
    <text x="170" y="284" text-anchor="end">U6</text>
    <text x="170" y="324" text-anchor="end">U7</text>
    <text x="170" y="364" text-anchor="end">U8</text>
    <text x="170" y="404" text-anchor="end">U9</text>
    <text x="170" y="444" text-anchor="end">U10</text>
    <text x="170" y="484" text-anchor="end">U11</text>
    <text x="170" y="524" text-anchor="end">U12</text>
  </g>
  <g stroke="#E3E1D9" stroke-width="1">
    <line x1="180" y1="100" x2="400" y2="100" />
    <line x1="180" y1="140" x2="400" y2="140" />
    <line x1="180" y1="180" x2="400" y2="180" />
    <line x1="180" y1="220" x2="400" y2="220" />
    <line x1="180" y1="260" x2="400" y2="260" />
    <line x1="180" y1="300" x2="400" y2="300" />
    <line x1="180" y1="340" x2="400" y2="340" />
    <line x1="180" y1="380" x2="400" y2="380" />
    <line x1="180" y1="420" x2="400" y2="420" />
    <line x1="180" y1="460" x2="400" y2="460" />
    <line x1="180" y1="500" x2="400" y2="500" />
  </g>

  <!-- rail mounting dots -->
  <g fill="#C7C4BB">
    <circle cx="186" cy="70" r="1.6" /><circle cx="394" cy="70" r="1.6" />
    <circle cx="186" cy="110" r="1.6" /><circle cx="394" cy="110" r="1.6" />
    <circle cx="186" cy="150" r="1.6" /><circle cx="394" cy="150" r="1.6" />
    <circle cx="186" cy="190" r="1.6" /><circle cx="394" cy="190" r="1.6" />
    <circle cx="186" cy="230" r="1.6" /><circle cx="394" cy="230" r="1.6" />
    <circle cx="186" cy="270" r="1.6" /><circle cx="394" cy="270" r="1.6" />
    <circle cx="186" cy="310" r="1.6" /><circle cx="394" cy="310" r="1.6" />
    <circle cx="186" cy="350" r="1.6" /><circle cx="394" cy="350" r="1.6" />
    <circle cx="186" cy="390" r="1.6" /><circle cx="394" cy="390" r="1.6" />
    <circle cx="186" cy="430" r="1.6" /><circle cx="394" cy="430" r="1.6" />
    <circle cx="186" cy="470" r="1.6" /><circle cx="394" cy="470" r="1.6" />
    <circle cx="186" cy="510" r="1.6" /><circle cx="394" cy="510" r="1.6" />
  </g>

  <!-- U1 Patch panel -->
  <rect x="192" y="64" width="196" height="32" rx="4" fill="#FFFFFF" stroke="#0E6E64" stroke-width="1.4" />
  <text x="290" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#1C2024">PATCH PANEL</text>

  <!-- U2 shelf: gateway/switch/HA green -->
  <rect x="192" y="104" width="196" height="32" rx="4" fill="#FFFFFF" stroke="#62676F" stroke-width="1.4" />
  <text x="290" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#1C2024">GATEWAY · SWITCH</text>
  <text x="290" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#62676F">+ Home Assistant Green</text>

  <!-- U3-U7 shelf: NAS + Yallo (5U) -->
  <rect x="192" y="144" width="196" height="192" rx="4" fill="#F5F4F0" stroke="#62676F" stroke-width="1.4" />
  <text x="290" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#1C2024">NAS DS918+</text>
  <text x="290" y="250" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#62676F">+ box Yallo</text>
  <text x="290" y="268" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#8A8F98">5U de dégagement vertical</text>

  <!-- U8 PDU -->
  <rect x="192" y="344" width="196" height="32" rx="4" fill="#FFFFFF" stroke="#62676F" stroke-width="1.4" />
  <text x="290" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#1C2024">PDU BACHMANN</text>

  <!-- U9 UPS -->
  <rect x="192" y="384" width="196" height="32" rx="4" fill="#FFFFFF" stroke="#B5651D" stroke-width="1.4" />
  <text x="290" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#1C2024">ONDULEUR</text>

  <!-- U10-U12 free margin (3U) -->
  <rect x="192" y="424" width="196" height="112" rx="4" fill="none" stroke="#D8D5CC" stroke-width="1.4" stroke-dasharray="4 4" />
  <text x="290" y="484" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.5" fill="#8A8F98">LIBRE — marge ~3U</text>

  <!-- legend -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#62676F">
    <rect x="180" y="560" width="12" height="12" fill="none" stroke="#0E6E64" stroke-width="1.4" />
    <text x="198" y="570">Réseau filaire (cuivre)</text>
    <rect x="180" y="580" width="12" height="12" fill="none" stroke="#B5651D" stroke-width="1.4" />
    <text x="198" y="590">Alimentation secourue</text>
  </g>
</svg>
